<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Shield & Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="50%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#0f3443" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f355da" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-core" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6" />
    </pattern>
  </defs>

  <style>
    .radar-line {
      transform-origin: 1020px 210px;
      animation: rotateRadar 10s linear infinite;
    }
    .pulse-circle {
      transform-origin: 1020px 210px;
      animation: pulseRadar 3.5s ease-out infinite;
    }
    .pulse-circle-2 {
      transform-origin: 1020px 210px;
      animation: pulseRadar 3.5s ease-out infinite 1.75s;
    }
    .signal-beam {
      stroke-dasharray: 8 12;
      animation: dashMove 3s linear infinite;
    }
    .status-ping {
      animation: blink 2s infinite ease-in-out;
    }
    @keyframes rotateRadar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulseRadar {
      0% { r: 15px; opacity: 0.8; }
      100% { r: 160px; opacity: 0; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes blink {
      0%, 100% { opacity: 0.3; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.08); }
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs (Background) -->
  <circle cx="150" cy="80" r="140" fill="#00f2fe" opacity="0.06" filter="url(#glow-core)" />
  <circle cx="1020" cy="210" r="180" fill="#7000ff" opacity="0.08" filter="url(#glow-core)" />
  <circle cx="600" cy="380" r="160" fill="#11998e" opacity="0.05" filter="url(#glow-core)" />

  <!-- DYNAMIC RADAR GRAPHIC (Right side background decoration) -->
  <g id="radar-system" opacity="0.85">
    <!-- Concentric Target Circles -->
    <circle cx="1020" cy="210" r="45" fill="none" stroke="#334155" stroke-width="1.5" />
    <circle cx="1020" cy="210" r="90" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6" />
    <circle cx="1020" cy="210" r="140" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="1020" cy="210" r="175" fill="none" stroke="#0f172a" stroke-width="2" />

    <!-- Radar Crosshairs -->
    <line x1="840" y1="210" x2="1200" y2="210" stroke="#334155" stroke-width="1" opacity="0.4" />
    <line x1="1020" y1="30" x2="1020" y2="390" stroke="#334155" stroke-width="1" opacity="0.4" />

    <!-- Pulsing Radar Echoes -->
    <circle class="pulse-circle" cx="1020" cy="210" r="30" fill="none" stroke="#00f2fe" stroke-width="2" />
    <circle class="pulse-circle-2" cx="1020" cy="210" r="30" fill="none" stroke="#38ef7d" stroke-width="1.5" />

    <!-- Rotating Radar Sweep Line -->
    <g class="radar-line">
      <line x1="1020" y1="210" x2="1190" y2="210" stroke="url(#cyan-glow)" stroke-width="2.5" filter="url(#glow-cyan)" />
      <polygon points="1020,210 1190,165 1190,210" fill="url(#cyan-glow)" opacity="0.12" />
    </g>

    <!-- Radar Blips / Threat Nodes -->
    <circle cx="970" cy="140" r="4" fill="#ff4757" filter="url(#glow-cyan)" />
    <text x="980" y="143" fill="#ff6b81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">THREAT: 98/100</text>
    
    <circle cx="1090" cy="270" r="4" fill="#38ef7d" />
    <text x="1100" y="274" fill="#2ed573" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">NODE: OK</text>

    <circle cx="1070" cy="120" r="3.5" fill="#ffa502" />
    <text x="1080" y="123" fill="#ffa502" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">ANOMALY</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Shield Badge, Typography & Capability Pills -->
  <g transform="translate(60, 48)">
    <!-- Security Shield Icon -->
    <g transform="translate(0, 8)" filter="url(#glow-cyan)">
      <path d="M28 2 L52 11 V29 C52 44.5 41.5 59 28 64 C14.5 59 4 44.5 4 29 V11 Z" fill="url(#shield-grad)" stroke="#00f2fe" stroke-width="2.5" />
      <!-- Inner Shield Checkmark/Graph -->
      <path d="M18 31 L25 38 L38 23" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Tag & Status Pill -->
    <g transform="translate(74, 12)">
      <rect width="265" height="28" rx="14" fill="#1e293b" stroke="#38ef7d" stroke-width="1.2" opacity="0.9" />
      <circle class="status-ping" cx="16" cy="14" r="5" fill="#38ef7d" />
      <text x="30" y="18" fill="#38ef7d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">UNIFIED SECOPS &amp; CSPM</text>
    </g>

    <!-- Main Title (Strictly Foregrounded & High Contrast) -->
    <text x="0" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Centralized Security &amp;
    </text>
    <text x="0" y="175" fill="url(#cyan-glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow-cyan)">
      Threat Dashboard Ecosystem
    </text>

    <!-- Subtitle -->
    <text x="2" y="215" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      Curated Multi-Cloud Posture, SIEM/XDR, Continuous Compliance &amp; Threat Intelligence
    </text>

    <!-- Dynamic Telemetry Connecting Stream Line -->
    <line class="signal-beam" x1="0" y1="240" x2="680" y2="240" stroke="#00f2fe" stroke-width="2" opacity="0.7" />

    <!-- Feature Attribute Badges / Pills -->
    <g transform="translate(0, 260)">
      <!-- Pill 1: CSPM / CWPP -->
      <g transform="translate(0, 0)">
        <rect width="145" height="34" rx="8" fill="#0f172a" stroke="#00f2fe" stroke-width="1.2" />
        <text x="14" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">🛡️ Multi-Cloud CSPM</text>
      </g>

      <!-- Pill 2: SIEM & XDR -->
      <g transform="translate(155, 0)">
        <rect width="135" height="34" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
        <text x="14" y="22" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">⚡ SIEM / SOAR / XDR</text>
      </g>

      <!-- Pill 3: Threat Feeds -->
      <g transform="translate(300, 0)">
        <rect width="165" height="34" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1.2" />
        <text x="14" y="22" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">🎯 Attack Path &amp; CTI</text>
      </g>

      <!-- Pill 4: Open Source -->
      <g transform="translate(475, 0)">
        <rect width="170" height="34" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" />
        <text x="14" y="22" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">💻 Top Open-Source Repos</text>
      </g>
    </g>
  </g>

  <!-- Border Outline Accent -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.6" />
</svg>
